name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test parser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2

      - name: Install dependencies
        run: npm install

      - name: Run parser tests
        run: npm run test

  test-rust:
    name: Test Rust bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Run cargo test
        run: cargo test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2

      - name: Install dependencies
        run: npm install

      - name: Check for parser generation issues
        run: |
          npm run generate
          git diff --exit-code
